name: Validate CYZOR Landing V4
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = ["#system", "#ai", "#modules", "#product", "#activate"]
          if not html.lower().startswith("<!doctype html>"):
              raise SystemExit("Missing HTML5 doctype")
          if '<html lang="pt-BR">' not in html:
              raise SystemExit("Missing pt-BR document language")
          if '<main id="main">' not in html:
              raise SystemExit("Missing main landmark")
          for target in required:
              if f'href="{target}"' not in html and f'id="{target[1:]}"' not in html:
                  raise SystemExit(f"Missing required target {target}")
          class P(HTMLParser):
              pass
          P().feed(html)
          print("HTML structure OK")
          print("Sections:", html.count("<section"))
          PY
      - name: Validate project assets and documents
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f docs/MASTER-PROMPT.md
          test -f docs/landing-v4-discovery.md
          test -f docs/landing-v4-wireframe.md
          test -f docs/landing-v4-art-direction.md
          test -f docs/landing-v4-design-system.md
          test -f docs/landing-v4-assets.md
          echo "Project structure OK"
